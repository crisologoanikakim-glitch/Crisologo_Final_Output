<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoleStyle Shoes Store</title>
<style>
:root{--navy:#101b35;--blue:#1d4ed8;--cyan:#0891b2;--gold:#fbbf24;--bg:#f3f6fb;--ink:#172033;--muted:#64748b;--line:#dbe3ef;--green:#15803d;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
header{background:linear-gradient(120deg,#101b35,#164e83);color:white;padding:28px 20px;text-align:center}
header h1{margin:0 0 8px;letter-spacing:1.5px;font-size:clamp(25px,4vw,38px)}
header p{margin:0;color:#dbeafe;font-size:14px}
.wrap{max-width:1180px;margin:24px auto;padding:0 16px}
.layout{display:grid;grid-template-columns:250px 1fr;gap:18px}
nav,.panel{background:white;border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 18px #1720330a}
nav{padding:14px;height:max-content;position:sticky;top:16px}
nav h3{margin:6px 10px 12px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
nav button{width:100%;border:0;background:transparent;text-align:left;padding:12px 11px;border-radius:9px;font-size:14px;cursor:pointer;color:#334155;margin:2px 0}
nav button:hover,nav button.active{background:#eaf2ff;color:#164eab;font-weight:bold}
nav button .num{display:inline-block;width:24px;color:var(--cyan);font-weight:bold}
main{min-width:0}.panel{padding:22px;min-height:400px}
h2{margin:0 0 8px;font-size:23px}.sub{color:var(--muted);font-size:14px;margin:0 0 20px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
input,select{padding:11px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;min-width:0}
.toolbar input{flex:1;min-width:170px}
.btn{border:0;border-radius:8px;background:var(--blue);color:white;padding:10px 15px;font-weight:bold;cursor:pointer}
.btn:hover{filter:brightness(.94)}.btn.secondary{background:#e8eef8;color:#1e3a8a}.btn.danger{background:#b91c1c}.btn.green{background:var(--green)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}
th{background:#eff5fc;color:#243b5a;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
th,td{padding:12px 11px;border-bottom:1px solid var(--line)}
tbody tr:hover{background:#f8fbff}tbody tr:last-child td{border-bottom:0}
.price{font-weight:bold;color:#123f87}.stock{font-weight:bold}
.empty{padding:35px;text-align:center;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.stat{background:#f1f6ff;border:1px solid #dce8fb;border-radius:10px;padding:14px}
.stat small{color:var(--muted)}.stat strong{display:block;font-size:22px;margin-top:5px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid label{font-size:13px;color:#475569;display:flex;flex-direction:column;gap:6px}
.form-grid input{width:100%}.form-grid .full{grid-column:1/-1}
.notice{padding:12px 14px;border-radius:9px;background:#ecfdf5;color:#166534;margin:12px 0;font-size:14px}
.notice.error{background:#fef2f2;color:#991b1b}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.brand-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.brand{border:1px solid var(--line);border-radius:12px;padding:22px 10px;text-align:center;background:linear-gradient(150deg,#fff,#f3f7ff);font-weight:bold;font-size:17px}
.muted{color:var(--muted);font-size:13px}
footer{text-align:center;color:#94a3b8;padding:22px;font-size:12px}
@media(max-width:800px){.layout{grid-template-columns:1fr}nav{position:static;display:grid;grid-template-columns:repeat(2,1fr)}nav h3{grid-column:1/-1}.brand-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.panel{padding:15px}.form-grid,.stats{grid-template-columns:1fr}nav{grid-template-columns:1fr 1fr}nav button{font-size:12px;padding:10px 7px}}
</style>
</head>
<body>
<header>
  <h1>SOLESTYLE SHOES STORE</h1>
  <p>BRAND-AFFILIATED E-COMMERCE INVENTORY &amp; SEARCH SYSTEM</p>
</header>
<div class="wrap">
<div class="layout">
<nav aria-label="Main menu">
  <h3>Store Menu</h3>
  <button class="active" data-page="catalog"><span class="num">1.</span> View Complete Catalog</button>
  <button data-page="brandFilter"><span class="num">2.</span> Filter by Official Brand</button>
  <button data-page="search"><span class="num">3.</span> Search Products</button>
  <button data-page="price"><span class="num">4.</span> Filter by Price Range</button>
  <button data-page="addCart"><span class="num">5.</span> Add Item to Cart</button>
  <button data-page="checkout"><span class="num">6.</span> Customer Checkout</button>
  <button data-page="undo"><span class="num">7.</span> Admin Undo Action</button>
  <button data-page="brands"><span class="num">8.</span> Partner Brand Showcase</button>
  <button data-page="sort"><span class="num">9.</span> Sort Inventory</button>
  <button data-page="exit"><span class="num">10.</span> Exit</button>
</nav>
<main><section class="panel" id="content"></section></main>
</div>
</div>
<footer>SOLESTYLE SHOES STORE &bull; Inventory and Shopping Cart System</footer>
<script>
const initialProducts = [
{id:101,brand:"Nike",name:"Air Max 270",price:6500,sizes:[6,7,8,9,10,11],stock:15},
{id:102,brand:"Nike",name:"Air Force 1",price:5500,sizes:[6,7,8,9,10,11],stock:12},
{id:103,brand:"Nike",name:"Jordan 1",price:7200,sizes:[7,8,9,10,11],stock:10},
{id:104,brand:"Adidas",name:"Ultraboost",price:6800,sizes:[6,7,8,9,10,11],stock:14},
{id:105,brand:"Adidas",name:"Superstar",price:4500,sizes:[6,7,8,9,10],stock:20},
{id:106,brand:"Adidas",name:"Forum Low",price:5200,sizes:[7,8,9,10,11],stock:12},
{id:107,brand:"Puma",name:"RS-X",price:4800,sizes:[6,7,8,9,10,11],stock:15},
{id:108,brand:"Puma",name:"Suede Classic",price:3900,sizes:[6,7,8,9,10],stock:18},
{id:109,brand:"Puma",name:"Cali Dream",price:4200,sizes:[6,7,8,9,10],stock:10},
{id:110,brand:"New Balance",name:"574 Classic",price:5800,sizes:[6,7,8,9,10,11],stock:15},
{id:111,brand:"New Balance",name:"327 Series",price:6200,sizes:[7,8,9,10,11],stock:12},
{id:112,brand:"New Balance",name:"9060",price:8500,sizes:[7,8,9,10,11],stock:8}
];
let products = initialProducts.map(p=>({...p,sizes:[...p.sizes]}));
let cart = [];
let undoStack = [];
let currentPage = "catalog";
const content = document.getElementById("content");
const money = n => "₱"+Number(n).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
function snapshot(){undoStack.push({cart:cart.map(x=>({...x})),products:products.map(p=>({...p,sizes:[...p.sizes]}))});if(undoStack.length>20)undoStack.shift();}
function notice(msg,error=false){return `<div class="notice ${error?'error':''}">${msg}</div>`}
function table(list){
 if(!list.length)return `<div class="empty">No products found.</div>`;
 return `<div class="table-wrap"><table><thead><tr><th>ID</th><th>Brand</th><th>Model</th><th>Price</th><th>Available Sizes</th><th>Stock</th></tr></thead><tbody>
 ${list.map(p=>`<tr><td>${p.id}</td><td>${p.brand}</td><td>${p.name}</td><td class="price">${money(p.price)}</td><td>${p.sizes.join(", ")}</td><td class="stock">${p.stock}</td></tr>`).join("")}
 </tbody></table></div><p class="muted">Total products displayed: ${list.length}</p>`;
}
function heading(title,sub){return `<h2>${title}</h2><p class="sub">${sub}</p>`}
function renderCatalog(list=products,title="Complete Shoe Catalog"){
 content.innerHTML=heading(title,"Browse all available shoes, prices, sizes, and stock.")+
 `<div class="stats"><div class="stat"><small>Total products</small><strong>${products.length}</strong></div><div class="stat"><small>Official brands</small><strong>${new Set(products.map(p=>p.brand)).size}</strong></div><div class="stat"><small>Cart items</small><strong>${cart.reduce((n,x)=>n+x.quantity,0)}</strong></div></div>`+table(list);
}
function renderBrandFilter(){
 content.innerHTML=heading("Filter Products by Official Brand","Choose a brand to display its available shoes.")+
 `<div class="toolbar"><select id="brandSelect"><option value="">Select a brand</option>${[...new Set(products.map(p=>p.brand))].sort().map(b=>`<option>${b}</option>`).join("")}</select><button class="btn" id="brandGo">Show Products</button></div><div id="results"></div>`;
 document.getElementById("brandGo").onclick=()=>{let b=document.getElementById("brandSelect").value;document.getElementById("results").innerHTML=b?table(products.filter(p=>p.brand===b)):notice("Please select a brand.",true)};
}
function renderSearch(){
 content.innerHTML=heading("Search Products by Keyword","Search by product ID, brand, or shoe model.")+
 `<div class="toolbar"><input id="keyword" placeholder="e.g. Nike, Air Max, or 101"><button class="btn" id="searchGo">Search</button></div><div id="results"></div>`;
 const run=()=>{let q=document.getElementById("keyword").value.trim().toLowerCase();let found=products.filter(p=>String(p.id)===q||p.brand.toLowerCase().includes(q)||p.name.toLowerCase().includes(q));document.getElementById("results").innerHTML=q?table(found):notice("Enter a keyword to search.",true)};
 document.getElementById("searchGo").onclick=run;document.getElementById("keyword").onkeydown=e=>{if(e.key==="Enter")run()};
}
function renderPrice(){
 content.innerHTML=heading("Filter Products by Price Range","Enter a minimum and maximum price to find matching shoes.")+
 `<div class="toolbar"><input type="number" id="minPrice" min="0" placeholder="Minimum price"><input type="number" id="maxPrice" min="0" placeholder="Maximum price"><button class="btn" id="priceGo">Apply Filter</button></div><div id="results"></div>`;
 document.getElementById("priceGo").onclick=()=>{let min=Number(document.getElementById("minPrice").value),max=Number(document.getElementById("maxPrice").value);if(document.getElementById("minPrice").value===""||document.getElementById("maxPrice").value===""||min<0||max<min){document.getElementById("results").innerHTML=notice("Please enter a valid price range.",true);return}document.getElementById("results").innerHTML=table(products.filter(p=>p.price>=min&&p.price<=max))};
}
function renderAddCart(){
 content.innerHTML=heading("Add Item to Shopping Cart","Select a product, shoe size, and quantity. The catalog is shown below.")+
 `<div class="form-grid"><label>Product<select id="cartProduct"><option value="">Choose product</option>${products.map(p=>`<option value="${p.id}">${p.id} - ${p.brand} ${p.name} (${money(p.price)})</option>`).join("")}</select></label><label>Shoe size<select id="cartSize"><option value="">Choose size</option></select></label><label>Quantity<input type="number" id="cartQty" min="1" value="1"></label></div><div class="actions"><button class="btn" id="addCartBtn">Add to Cart</button><button class="btn secondary" id="showCartBtn">View Shopping Cart</button></div><div id="message"></div><h3 style="margin-top:26px">Available Products</h3>${table(products)}`;
 const prod=document.getElementById("cartProduct"),size=document.getElementById("cartSize");
 prod.onchange=()=>{let p=products.find(x=>x.id===Number(prod.value));size.innerHTML='<option value="">Choose size</option>'+(p?p.sizes.map(s=>`<option value="${s}">${s}</option>`).join(""):"")};
 document.getElementById("addCartBtn").onclick=()=>{let p=products.find(x=>x.id===Number(prod.value)),s=Number(size.value),q=Number(document.getElementById("cartQty").value);let msg=document.getElementById("message");if(!p||!p.sizes.includes(s)||!Number.isInteger(q)||q<1){msg.innerHTML=notice("Please select a product and valid size and quantity.",true);return}let existing=cart.find(x=>x.id===p.id&&x.size===s);let inCart=cart.filter(x=>x.id===p.id).reduce((n,x)=>n+x.quantity,0);if(inCart+q>p.stock){msg.innerHTML=notice("Insufficient stock for this product.",true);return}snapshot();if(existing)existing.quantity+=q;else cart.push({id:p.id,size:s,quantity:q});msg.innerHTML=notice(`${q} pair(s) of ${p.brand} ${p.name}, size ${s}, added to cart.`)};
 document.getElementById("showCartBtn").onclick=()=>navigate("checkout");
}
function cartRows(){
 return cart.map(x=>{let p=products.find(p=>p.id===x.id);return {...x,product:p,subtotal:p.price*x.quantity}});
}
function renderCheckout(){
 let rows=cartRows(),total=rows.reduce((n,x)=>n+x.subtotal,0);
 content.innerHTML=heading("Customer Checkout Queue","Review the cart, remove items, or complete checkout.")+
 (rows.length?`<div class="table-wrap"><table><thead><tr><th>ID</th><th>Brand</th><th>Model</th><th>Size</th><th>Qty</th><th>Price</th><th>Subtotal</th><th>Action</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.id}</td><td>${x.product.brand}</td><td>${x.product.name}</td><td>${x.size}</td><td>${x.quantity}</td><td>${money(x.product.price)}</td><td>${money(x.subtotal)}</td><td><button class="btn danger" data-remove="${x.id}" data-size="${x.size}">Remove</button></td></tr>`).join("")}</tbody></table></div><h3 style="text-align:right;margin:18px 0">Total Payment: ${money(total)}</h3><div class="actions"><button class="btn green" id="confirmCheckout">Confirm Checkout</button><button class="btn secondary" id="continueShopping">Continue Shopping</button></div><div id="message"></div>`: `<div class="empty">Your shopping cart is empty.</div><button class="btn" id="continueShopping">Browse Products</button>`);
 content.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{snapshot();cart=cart.filter(x=>!(x.id===Number(b.dataset.remove)&&x.size===Number(b.dataset.size)));renderCheckout()});
 let cont=document.getElementById("continueShopping");if(cont)cont.onclick=()=>navigate("addCart");
 let confirm=document.getElementById("confirmCheckout");if(confirm)confirm.onclick=()=>{for(let x of rows){let p=products.find(p=>p.id===x.id);if(x.quantity>p.stock){document.getElementById("message").innerHTML=notice(`Insufficient stock for ${p.name}.`,true);return}}snapshot();rows.forEach(x=>{let p=products.find(p=>p.id===x.id);p.stock-=x.quantity});cart=[];content.innerHTML=heading("Checkout Complete","Your order has been processed.")+notice("Checkout successful! Thank you for shopping at SoleStyle Shoes Store.")+`<button class="btn" id="backCatalog">Back to Catalog</button>`;document.getElementById("backCatalog").onclick=()=>navigate("catalog")};
}
function renderUndo(){
 content.innerHTML=heading("Admin Undo Action","Restore the previous cart and inventory state.")+
 `<p>Undo history available: <strong>${undoStack.length}</strong></p><button class="btn" id="undoBtn" ${undoStack.length?"":"disabled"}>Undo Last Action</button><div id="message"></div>`;
 document.getElementById("undoBtn").onclick=()=>{if(!undoStack.length)return;let state=undoStack.pop();cart=state.cart;products=state.products;renderUndo();document.getElementById("message").innerHTML=notice("The previous action has been undone.")};
}
function renderBrands(){
 content.innerHTML=heading("Partner Brand Banner Showcase","Official shoe brands available in the SoleStyle inventory.")+
 `<div class="brand-grid">${[...new Set(products.map(p=>p.brand))].sort().map(b=>`<div class="brand">${b.toUpperCase()}</div>`).join("")}</div>`;
}
function renderSort(){
 content.innerHTML=heading("Sort Inventory Display","Organize products by price, stock, or brand.")+
 `<div class="toolbar"><select id="sortBy"><option value="price">Price</option><option value="stock">Stock</option><option value="brand">Brand</option></select><select id="sortOrder"><option value="asc">Ascending</option><option value="desc">Descending</option></select><button class="btn" id="sortGo">Sort Products</button></div><div id="results">${table(products)}</div>`;
 document.getElementById("sortGo").onclick=()=>{let key=document.getElementById("sortBy").value,dir=document.getElementById("sortOrder").value==="asc"?1:-1;let sorted=[...products].sort((a,b)=>key==="brand"?a.brand.localeCompare(b.brand)*dir:(a[key]-b[key])*dir);document.getElementById("results").innerHTML=table(sorted)};
}
function navigate(page){
 currentPage=page;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
 if(page==="catalog")renderCatalog();
 else if(page==="brandFilter")renderBrandFilter();
 else if(page==="search")renderSearch();
 else if(page==="price")renderPrice();
 else if(page==="addCart")renderAddCart();
 else if(page==="checkout")renderCheckout();
 else if(page==="undo")renderUndo();
 else if(page==="brands")renderBrands();
 else if(page==="sort")renderSort();
 else if(page==="exit")content.innerHTML=heading("Thank You for Visiting!","Thank you for shopping at SoleStyle Shoes Store.")+`<p class="muted">You may close this browser tab.</p>`;
}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>navigate(b.dataset.page)));
navigate("catalog");
</script>
</body>
</html>'''
path = Path("/mnt/data/index.html")
path.write_text(html, encoding="utf-8")
print(f"Created {path} ({path.stat().st_size:,} bytes)")
